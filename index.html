
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RebelBlockz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: #0D0D0D;
    color: #fff;
    text-align: center;
    padding: 40px 20px;
  }

  .logo {
    width: 90%;
    max-width: 750px;
    margin: 0 auto 30px auto;
  }

  h1 {
    font-size: 3rem;
    margin-top: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  h2 {
    font-size: 1.3rem;
    opacity: 0.85;
    margin-top: 5px;
    letter-spacing: 2px;
  }

  p {
    max-width: 700px;
    margin: 20px auto;
    font-size: 1.2rem;
    line-height: 1.6;
  }

  footer {
    margin-top: 50px;
    font-size: 0.9rem;
    opacity: 0.8;
  }
</style>
</head>

<body>

<!-- Brick Outline Logo -->
<svg class="logo" viewBox="0 0 900 250">
  <rect x="100" y="40" width="700" height="170" 
        rx="20" ry="20"
        fill="none" 
        stroke="#ffffff" 
        stroke-width="8" />

  <!-- Studs -->
  <circle cx="200" cy="80" r="18" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="300" cy="80" r="18" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="400" cy="80" r="18" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="500" cy="80" r="18" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="600" cy="80" r="18" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="700" cy="80" r="18" fill="none" stroke="#ffffff" stroke-width="6"/>

  <!-- Larger Logo Text -->
  <text x="50%" y="165" 
        dominant-baseline="middle" 
        text-anchor="middle"
        font-family="Montserrat" 
        font-weight="900" 
        font-size="110"
        fill="#ffffff"
        letter-spacing="4">
    REBELBLOCKZ
  </text>
</svg>

<h2>Coming Soon</h2>

<p>
  RebelBlockz is being rebuilt from the ground up — one brick at a time,  
  with no instructions and no limits.  
  A new experience is on the way.
</p>

<footer>
  © 2026 RebelBlockz — Coming soon (whether the world is ready or not)
</footer>

</body>
</html>
