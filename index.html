
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RebelBlockz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: #0D0D0D;
    color: #fff;
    text-align: center;
    padding: 40px 20px;
  }

  .logo {
    width: 90%;
    max-width: 750px;
    margin: 0 auto 30px auto;
  }

  h1 {
    font-size: 3rem;
    margin-top: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  h2 {
    font-size: 1.3rem;
    opacity: 0.85;
    margin-top: 5px;
    letter-spacing: 2px;
  }

  p {
    max-width: 700px;
    margin: 20px auto;
    font-size: 1.2rem;
    line-height: 1.6;
  }

  footer {
    margin-top: 50px;
    font-size: 0.9rem;
    opacity: 0.8;
  }
</style>
</head>

<body>

<!-- Brick Outline Logo -->
<svg class="logo" viewBox="0 0 1100 250">
  <!-- Longer Brick Outline -->
  <rect x="50" y="40" width="1000" height="100" 
        rx="20" ry="20"
        fill="none" 
        stroke="#FF0000" 
        stroke-width="8" />


  <!-- Centered Logo Text -->
  <text x="50%" y="165" 
        dominant-baseline="middle" 
        text-anchor="middle"
        font-family="Montserrat" 
        font-weight="900" 
        font-size="110"
        fill="#ffffff"
        letter-spacing="4">
    REBELBLOCKZ
  </text>
</svg>

<div style="text-align: center;">
  <img src="images/RBZ.png" alt="Logo" style="width:300px;">
</div>

<h2>Coming Soon</h2>

<p>
  RebelBlockz is being rebuilt from the ground up — one brick at a time,  
  with no instructions and no limits.  
  A new experience is on the way.
</p>

<a href="https://instagram.com/rebelblockz" target="_blank" class="rebel-ig-btn">
  <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" 
       alt="Instagram" class="ig-icon">
  Follow @rebelblockz
</a>

<style>
  .rebel-ig-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 24px;
    background-color: #CD4035; /* Rebel Red */
    color: #0A0A0A; /* Rebel Black */
    font-weight: bold;
    text-decoration: none;
    border-radius: 6px;
    letter-spacing: 0.5px;
    transition: 0.2s ease;
  }

  .rebel-ig-btn:hover {
    background-color: #b3382f; /* Slightly darker Rebel Red */
    transform: translateY(-2px);
  }

  .ig-icon {
    width: 22px;
    height: 22px;
  }
</style>

  
<footer>
  © 2026 RebelBlockz — Coming soon (whether the world is ready or not)<br>
  Contact: <a href="mailto:info@rebelblockz.com">info@rebelblockz.com</a>
</footer>


</body>
</html>
